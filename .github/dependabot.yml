version: 2
updates:
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: daily
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: "docker"
  directory: "/examples"
  schedule:
    interval: "daily"
