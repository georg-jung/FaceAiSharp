name: CI

on:
  workflow_call:
    inputs:
      build-ref:
        required: true
        type: string
  workflow_dispatch:
  push:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  # Six Labors license for SixLabors.ImageSharp >= 3.2.0; not needed when sixlabors.lic is committed at the repository root.
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        lfs: true
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x
    - uses: dotnet/nbgv@v0.5
      id: nbgv
    - run: dotnet restore /p:ContinuousIntegrationBuild=true
    - run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true
    - run: >-
        dotnet test
        -c Release --no-restore --no-build
        /p:ContinuousIntegrationBuild=true
        /p:CoverletOutputFormat=\"opencover,cobertura\"
        -s CodeCoverage.runsettings
        --collect:"XPlat Code Coverage"
        --logger "GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true"
        --
        RunConfiguration.CollectSourceInformation=true
    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: "**/coverage.cobertura.xml"
        targetdir: coveragereport
        reporttypes: "Html;MarkdownSummaryGithub"
        license: ${{ secrets.ReportGeneratorLicense }}
    - uses: actions/upload-artifact@v7
      with:
        name: CoverageReport-${{ steps.nbgv.outputs.Version }}
        path: coveragereport
    - name: Publish coverage in build summary # Only applicable if 'MarkdownSummaryGithub' or one of the other Markdown report types is generated
      run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      shell: bash
    - name: Upload coverage reports to Codecov
      # Skipped where the secret isn't available (forks, Dependabot-triggered runs);
      # where it is, a failed upload fails the build instead of passing silently.
      if: ${{ env.CODECOV_TOKEN }}
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        slug: georg-jung/FaceAiSharp
        fail_ci_if_error: true
    - run: dotnet pack -c Release --no-restore --no-build /p:ContinuousIntegrationBuild=true
    
    - uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: bin/Packages/Release/**/*
    
    - uses: actions/attest@v4
      if: github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag'
      with:
        subject-path: |
          bin/Packages/Release/**/*.nupkg
          bin/Packages/Release/**/*.snupkg